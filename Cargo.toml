# The Rust workspace: Typfolio's Typst compiler for WebAssembly (`crates/compiler`, shipped as `@typfolio/wasm`) and the
# paramdoc experiment's crates. One workspace, one `Cargo.lock`: the compiler and the paramdoc exporter resolve the same
# Typst crates, so what the exporter lays out is what the compiler lays out.
[workspace]
resolver = "2"
members = ["crates/compiler", "experiments/paramdoc/ir", "experiments/paramdoc/export", "experiments/paramdoc/runtime"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false
version = "0.0.0"

[workspace.dependencies]
# The Typst version every crate here binds. `compiler-source.json` pins the same number; tools/build-wasm.ts checks
# that the lockfile agrees.
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-layout = "0.15.1"
comemo = "0.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"

# Size-oriented release profile for the wasm builds. The compiler build (tools/build-wasm.ts) does not rely on it: it
# sets every field from `cargoProfile` in compiler-source.json through CARGO_PROFILE_RELEASE_* so the shipped binary is
# pinned there, not here.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
