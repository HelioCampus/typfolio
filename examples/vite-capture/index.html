<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Typfolio capture browser smoke test</title>
<style>
  body { font: 16px/1.4 system-ui, sans-serif; margin: 24px; }
  #report { display: flex; width: 640px; gap: 24px; align-items: flex-start; }
  .bar { fill: #2f6f4f; }
  .card { flex: none; width: 260px; padding: 16px; border-radius: 12px; color: #fff; background: linear-gradient(135deg, #1d3557, #457b9d); }
  .card h2 { margin: 0 0 8px; font-size: 18px; }
  .card strong { font-size: 32px; }
  #captured { display: flex; gap: 24px; align-items: flex-start; }
  #captured img { border: 1px dashed #999; }
</style>
<h1>Typfolio capture browser smoke test</h1>
<p>Live regions:</p>
<main id="report">
  <figure id="chart">
    <svg viewBox="0 0 120 60" width="240" height="120" role="img" aria-label="Bar chart">
      <rect class="bar" x="10" y="36" width="24" height="24" />
      <rect class="bar" x="48" y="20" width="24" height="40" />
      <rect class="bar" x="86" y="6" width="24" height="54" />
    </svg>
  </figure>
  <section id="card" class="card">
    <h2>Outcome summary</h2>
    <p><strong>72%</strong> of students met the goal.</p>
  </section>
</main>
<p>Captured assets, then the compiled PDF:</p>
<div id="captured"></div>
<pre id="result" data-status="running">Capturing regions and compiling...</pre>
<script type="module" src="./smoke.ts"></script>
</html>
