[workspace]
resolver = "2"
members = ["ir", "export", "runtime"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false
version = "0.0.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"

# Size-oriented release profile, used to measure what a browser runtime would weigh.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
